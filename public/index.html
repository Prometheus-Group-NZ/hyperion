<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>HYPERION // Prometheus Fleet Launchpad</title>
  <meta name="description" content="Hyperion - Central Ingress Catalogue and Minimalist Tactical Fleet Launchpad for Prometheus Group NZ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #06090c;
      --bg-surface: #0c1017;
      --bg-card: rgba(14, 20, 28, 0.88);
      --bg-card-hover: rgba(22, 32, 45, 0.96);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-active: rgba(0, 255, 102, 0.4);
      
      --accent-green: #00ff66;
      --accent-cyan: #00e5ff;
      --accent-blue: #3b82f6;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --crt-bg: #000d00;
      --crt-phosphor: #00ff66;
      --crt-dim: rgba(0, 255, 102, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.06) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(0, 255, 102, 0.04) 0%, transparent 50%);
    }

    /* ==========================================================================
       IRIS-PC TERMINAL CRT AUTHENTICATION OVERLAY
       ========================================================================== */
    #authOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      z-index: 999999;
      background-color: var(--crt-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 32px);
      box-sizing: border-box;
      font-family: 'Share Tech Mono', 'JetBrains Mono', monospace;
      color: var(--crt-phosphor);
      overflow: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #authOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #authOverlay::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 2;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    #authOverlay::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at center, transparent 65%, rgba(0, 0, 0, 0.65) 100%);
      z-index: 3;
      pointer-events: none;
    }

    .auth-center-stage {
      position: relative;
      z-index: 4;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
      background: rgba(0, 20, 5, 0.4);
      border: 1px solid rgba(0, 255, 102, 0.2);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.08), inset 0 0 20px rgba(0, 255, 102, 0.03);
    }

    .auth-badge {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--crt-dim);
      margin-bottom: 8px;
    }

    .auth-title {
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--crt-phosphor);
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
      margin-bottom: 24px;
    }

    .auth-otp-pure {
      display: flex;
      gap: clamp(8px, 2.5vw, 14px);
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 10px 0;
    }

    .otp-square {
      flex: 0 1 clamp(42px, 12vw, 56px);
      width: clamp(42px, 12vw, 56px);
      height: clamp(52px, 15vw, 66px);
      background-color: rgba(0, 35, 10, 0.7);
      border: 1px solid rgba(0, 255, 102, 0.3);
      border-radius: 8px;
      color: var(--crt-phosphor);
      font-size: clamp(24px, 7vw, 32px);
      font-weight: 700;
      font-family: inherit;
      text-align: center;
      outline: none;
      box-sizing: border-box;
      caret-color: transparent;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    .otp-square:focus {
      border-color: var(--crt-phosphor);
      background-color: rgba(0, 50, 15, 0.85);
      box-shadow: 0 0 14px rgba(0, 255, 102, 0.4);
    }

    .auth-stay-toggle {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--crt-dim);
      cursor: pointer;
      user-select: none;
    }

    .auth-stay-toggle input {
      accent-color: var(--crt-phosphor);
      cursor: pointer;
    }

    .auth-status-msg {
      margin-top: 18px;
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--crt-dim);
      min-height: 18px;
    }

    .auth-status-msg.error {
      color: #ff3344;
      text-shadow: 0 0 8px rgba(255, 51, 68, 0.5);
      animation: shake 0.3s ease;
    }

    .auth-status-msg.info {
      color: var(--crt-phosphor);
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
    }

    /* ==========================================================================
       TOP HUD & CONTROLS
       ========================================================================== */
    .top-hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(6, 9, 12, 0.95);
      backdrop-filter: blur(14px);
      z-index: 1000;
      flex-shrink: 0;
      transform: translateY(0);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
    }

    .top-hud.header-hidden {
      transform: translateY(-100%);
      pointer-events: none;
      opacity: 0;
    }

    /* Floating Macron Button for non-touch / desktop devices */
    .btn-header-macron {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 16, 23, 0.92);
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-radius: 20px;
      color: var(--accent-cyan);
      padding: 6px 24px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      z-index: 999;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7), 0 0 10px rgba(0, 229, 255, 0.2);
      transition: all 0.25s ease;
      display: none;
    }

    .btn-header-macron:hover {
      background: rgba(0, 229, 255, 0.25);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.55);
      color: #fff;
      transform: translateX(-50%) translateY(2px);
    }

    body.header-is-hidden .btn-header-macron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-symbol {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border-active);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-green);
      font-size: 16px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.15);
      background: rgba(0, 255, 102, 0.05);
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(16px, 2.5vw, 18px);
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
    }

    .brand-text p {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      font-family: 'Share Tech Mono', monospace;
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 540px;
      justify-content: flex-end;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 180px;
    }

    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px 10px 34px;
      color: #fff;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 14px;
      pointer-events: none;
    }

    .btn-lock {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 9px 14px;
      border-radius: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-lock:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--accent-red);
      color: #fff;
    }

    /* ==========================================================================
       DYNAMIC 3D SPATIAL VIEWPORT
       ========================================================================== */
    .spatial-viewport-3d {
      position: relative;
      width: 100%;
      flex: 1;
      overflow: hidden;
      perspective: 1100px;
      perspective-origin: 50% 50%;
      user-select: none;
      cursor: default;
    }

    .space-3d-scene {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* Sector Group (Anchor in 3D Space) */
    .sector-space-node {
      position: absolute;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    /* 1. FRONT LAYER: Square Category Tile (z = 0) */
    .sector-front-square {
      position: absolute;
      width: 260px;
      height: 260px;
      transform: translate(-50%, -50%);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      transform-style: preserve-3d;
    }

    .sector-front-square:hover {
      border-color: rgba(255, 255, 255, 0.35);
      background: var(--bg-card-hover);
      box-shadow: 0 16px 40px -5px rgba(0, 0, 0, 0.75);
    }

    .sector-front-square.active-target {
      border-color: var(--accent-cyan) !important;
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.4) !important;
    }

    .sector-front-square.sector-ai:hover { border-color: rgba(56, 189, 248, 0.6); box-shadow: 0 0 30px rgba(56, 189, 248, 0.25); }
    .sector-front-square.sector-security:hover { border-color: rgba(239, 68, 68, 0.6); box-shadow: 0 0 30px rgba(239, 68, 68, 0.25); }
    .sector-front-square.sector-intel:hover { border-color: rgba(245, 158, 11, 0.6); box-shadow: 0 0 30px rgba(245, 158, 11, 0.25); }
    .sector-front-square.sector-fleet:hover { border-color: rgba(16, 185, 129, 0.6); box-shadow: 0 0 30px rgba(16, 185, 129, 0.25); }
    .sector-front-square.sector-games:hover { border-color: rgba(168, 85, 247, 0.6); box-shadow: 0 0 30px rgba(168, 85, 247, 0.25); }
    .sector-front-square.sector-science:hover { border-color: rgba(6, 182, 212, 0.6); box-shadow: 0 0 30px rgba(6, 182, 212, 0.25); }
    .sector-front-square.sector-social:hover { border-color: rgba(236, 72, 153, 0.6); box-shadow: 0 0 30px rgba(236, 72, 153, 0.25); }
    .sector-front-square.sector-technology:hover { border-color: rgba(234, 179, 8, 0.6); box-shadow: 0 0 30px rgba(234, 179, 8, 0.25); }

    .sector-front-square.standby {
      border: 1px dashed rgba(255, 255, 255, 0.15);
      background: rgba(14, 20, 28, 0.45);
    }

    .sector-square-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(20px, 2.2vw, 25px);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      text-align: center;
      margin: 0;
    }

    .sector-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-ai { background: #38bdf8; box-shadow: 0 0 14px #38bdf8; }
    .dot-sec { background: #ef4444; box-shadow: 0 0 14px #ef4444; }
    .dot-intel { background: #f59e0b; box-shadow: 0 0 14px #f59e0b; }
    .dot-fleet { background: #10b981; box-shadow: 0 0 14px #10b981; }
    .dot-games { background: #a855f7; box-shadow: 0 0 14px #a855f7; }
    .dot-sci { background: #06b6d4; box-shadow: 0 0 14px #06b6d4; }
    .dot-soc { background: #ec4899; box-shadow: 0 0 14px #ec4899; }
    .dot-tech { background: #eab308; box-shadow: 0 0 14px #eab308; }
    .dot-standby { background: #64748b; box-shadow: 0 0 10px #64748b; }

    /* 2. DEEP LAYER: 3x3 Project Grid Cluster (z = -480px) */
    .sector-deep-cluster {
      position: absolute;
      width: 780px;
      transform: translate(-50%, -50%) translateZ(-480px);
      display: grid;
      grid-template-columns: repeat(3, 246px);
      gap: 14px;
      pointer-events: none;
      opacity: 0;
      transform-style: preserve-3d;
      transition: opacity 0.2s ease;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 190px;
      box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .project-card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: var(--accent-cyan);
      box-shadow: 0 16px 36px -5px rgba(0, 229, 255, 0.3);
      background: var(--bg-card-hover);
    }

    .project-card:hover .project-title {
      color: var(--accent-cyan);
    }

    .project-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .project-id-tag {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .project-live-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
    }

    .port-pill {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      padding: 2px 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      color: var(--text-muted);
    }

    .project-body {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .project-title {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      transition: color 0.15s ease;
    }

    .project-subdomain {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: var(--accent-cyan);
      word-break: break-all;
    }

    .project-desc {
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .project-card.slot-standby {
      border: 1px dashed rgba(255, 255, 255, 0.12);
      background: rgba(14, 20, 28, 0.35);
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: default;
    }

    .project-card.slot-standby:hover {
      transform: none;
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.6);
      background: rgba(14, 20, 28, 0.35);
    }

    .slot-standby-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .slot-icon {
      font-size: 20px;
      color: var(--text-dim);
      opacity: 0.5;
    }

    .slot-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-dim);
    }

    .slot-desc {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.2);
    }

    /* ==========================================================================
       TACTICAL 3D HUD OVERLAYS & CONTROLS
       ========================================================================== */
    .hud-3d-panel {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      pointer-events: none;
      z-index: 50;
      font-family: 'Share Tech Mono', monospace;
    }

    .hud-depth-gauge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(6, 9, 12, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 16px;
      backdrop-filter: blur(8px);
    }

    .depth-bar-track {
      width: 100px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .depth-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
      transition: width 0.1s ease;
    }

  </style>
</head>
<body>

  <!-- ========================================================================
       IRIS-PC CRT TERMINAL AUTHENTICATION OVERLAY (6-DIGIT PIN)
       ======================================================================== -->
  <div id="authOverlay">
    <div class="auth-center-stage">
      <div class="auth-badge">PROMETHEUS SECURITY GATEWAY</div>
      <div class="auth-title">HYPERION INGRESS</div>
      
      <div class="auth-otp-pure" id="authPinContainer">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="0" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="1" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="2" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="3" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="4" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="5" autocomplete="off">
      </div>

      <label class="auth-stay-toggle" id="authStayWrapper">
        <input type="checkbox" id="authStayCheckbox" checked>
        <span>STAY LOGGED IN (48H)</span>
      </label>

      <div id="authStatusMsg" class="auth-status-msg">ENTER AUTHORIZATION PIN</div>
    </div>
  </div>

  <!-- ========================================================================
       MAIN HYPERION 3D LAUNCHPAD INTERFACE
       ======================================================================== -->
  <header class="top-hud">
    <div class="brand-section">
      <div class="brand-symbol">&#9650;</div>
      <div class="brand-text">
        <h1 id="hudBrandTitle">HYPERION</h1>
        <p id="hudBrandSubtitle">PROMETHEUS FLEET LAUNCHPAD // 3D SPATIAL DIVE MATRIX</p>
      </div>
    </div>

    <div class="hud-controls">
      <div class="search-box">
        <span class="search-icon">&#128269;</span>
        <input type="text" id="searchInput" placeholder="Search node, tool or sector (auto-dives)..." autocomplete="off">
      </div>
      <button class="btn-lock" id="btnLockSession" title="Lock Session">&#128274; LOCK</button>
    </div>
  </header>

  <!-- Floating Macron Button for Non-Touch Devices -->
  <button class="btn-header-macron" id="btnHeaderMacron" title="Open Header [—]">&#8212;</button>

  <!-- Dynamic 3D Spatial Viewport -->
  <main class="spatial-viewport-3d" id="spatialViewport">
    <div class="space-3d-scene" id="space3DScene">
      <!-- 9 Sectors positioned dynamically in 3D -->
    </div>

    <!-- Floating Tactical 3D HUD -->
    <div class="hud-3d-panel">
      <div class="hud-depth-gauge">
        <span style="color: var(--text-dim); font-size: 11px;">DEPTH</span>
        <div class="depth-bar-track">
          <div class="depth-bar-fill" id="depthBarFill"></div>
        </div>
        <span id="depthLabel" style="font-size: 11px; color: var(--accent-cyan); min-width: 32px;">0%</span>
      </div>
    </div>
  </main>

  <script>
    (function () {
      // Configuration & Unlock PINs
      const VALID_PINS = ['111111', '1111'];
      const SESSION_KEY = 'hyperion_auth_session';
      const EXPIRY_KEY = 'hyperion_auth_expiry';

      // ======================================================================
      // 9 SECTOR REGISTRY WITH DEDICATED CHILD INGRESS NODES
      // ======================================================================
      const SECTOR_REGISTRY = [
        {
          id: 'ai',
          index: '01',
          title: 'AI',
          dotClass: 'dot-ai',
          projects: [
            { title: 'Antigravity IDE', subdomain: 'antigravity.prometheus.nz', url: 'https://antigravity.prometheus.nz', port: ':3000', desc: 'Advanced agentic IDE and autonomous coding command hub.' },
            { title: 'OpenCode Runtime', subdomain: 'opencode.prometheus.nz', url: 'https://opencode.prometheus.nz', port: ':8080', desc: 'Distributed headless execution runtime and sandbox environment.' },
            { title: 'Iris Duplex Voice', subdomain: 'iris.prometheus.nz', url: 'https://iris.prometheus.nz', port: ':3000', desc: 'Real-time bidirectional neural voice bridge and speech telemetry.' },
            { title: 'Lyra Orchestrator', subdomain: 'lyra.prometheus.nz', url: 'https://lyra.prometheus.nz', port: ':8000', desc: 'Multi-modal model routing and context memory manager.' }
          ]
        },
        {
          id: 'security',
          index: '02',
          title: 'Security',
          dotClass: 'dot-sec',
          projects: [
            { title: 'Security Intelligence Hub', subdomain: 'security.prometheus.nz', url: 'https://security.prometheus.nz', port: ':5000', desc: 'Global threat monitoring and automated perimeter firewall rules.' },
            { title: 'Heimdall Gateway', subdomain: 'heimdall.prometheus.nz', url: 'https://heimdall.prometheus.nz', port: ':5000', desc: 'Unified authentication ingress proxy and access management.' },
            { title: 'Siren Alerts', subdomain: 'alerts.prometheus.nz', url: 'https://alerts.prometheus.nz', port: 'SIREN', desc: 'Emergency broadcast system and push alert notification daemon.' }
          ]
        },
        {
          id: 'intel',
          index: '03',
          title: 'Intel',
          dotClass: 'dot-intel',
          projects: [
            { title: 'ADS-B Radar & SIGINT SDR', subdomain: 'adsb.prometheus.nz', url: 'https://adsb.prometheus.nz', port: ':1090', desc: 'Real-time 1090MHz Mode-S ADS-B aircraft radar & dynamic multi-band SDR spectrum switchboard.' },
            { title: 'Halo Wireless SIGINT', subdomain: 'halo.prometheus.nz', url: 'https://halo.prometheus.nz', port: ':2501', desc: 'Distributed wireless sensor array, packet capture and RF telemetry.' },
            { title: 'Military Tactical Ops', subdomain: 'military.prometheus.nz', url: 'https://military.prometheus.nz', port: ':5000', desc: 'Tactical command, geofencing, and strategic node tracking.' }
          ]
        },
        {
          id: 'fleet',
          index: '04',
          title: 'Fleet',
          dotClass: 'dot-fleet',
          projects: [
            { title: 'Arachne Fleet Manager', subdomain: 'arachne.prometheus.nz', url: 'https://arachne.prometheus.nz', port: ':5000', desc: 'Autonomous telemetry agent, node orchestration and mesh sync.' },
            { title: 'Proxmox Hypervisor', subdomain: 'server.prometheus.nz', url: 'https://server.prometheus.nz', port: ':8006', desc: 'Cluster virtualization engine, VM/LXC compute and storage control.' },
            { title: 'Core Gateway Router', subdomain: 'admin.prometheus.nz', url: 'https://admin.prometheus.nz', port: ':80', desc: 'Core gateway routing, DNS resolver and LAN traffic control.' },
            { title: 'CUPS Print Spooler', subdomain: 'printers.prometheus.nz', url: 'https://printers.prometheus.nz', port: ':631', desc: 'Network print spooler daemon and document dispatch queue.' }
          ]
        },
        {
          id: 'games',
          index: '05',
          title: 'Games',
          dotClass: 'dot-games',
          projects: [
            { title: 'Games Cluster', subdomain: 'games.prometheus.nz', url: 'https://games.prometheus.nz', port: ':5000', desc: 'Interactive gaming host, high-throughput render stream and state store.' },
            { title: 'Simulation Engine', subdomain: 'simulation.prometheus.nz', url: 'https://simulation.prometheus.nz', port: ':5000', desc: 'Physics modeling, procedural generation and world state computing.' },
            { title: 'Virtual Reality Node', subdomain: 'virtualreality.prometheus.nz', url: 'https://virtualreality.prometheus.nz', port: ':5000', desc: 'Spatial computing gateway, WebXR bridge and immersive viewports.' }
          ]
        },
        {
          id: 'science',
          index: '06',
          title: 'Science',
          dotClass: 'dot-sci',
          projects: [
            { title: 'Science Lab', subdomain: 'science.prometheus.nz', url: 'https://science.prometheus.nz', port: ':5000', desc: 'Central laboratory environment, scientific computing and data logging.' },
            { title: 'DNA Browser', subdomain: 'dna.prometheus.nz', url: 'https://dna.prometheus.nz', port: 'DNA', desc: 'Genomic sequence analysis, nucleotide mapping and genetic explorer.' }
          ]
        },
        {
          id: 'social',
          index: '07',
          title: 'Social',
          dotClass: 'dot-soc',
          projects: [
            { title: 'Family Portal', subdomain: 'family.prometheus.nz', url: 'https://family.prometheus.nz', port: ':5000', desc: 'Shared ecosystem portal, family calendar, tasks and home automation.' },
            { title: 'Finance Analytics', subdomain: 'finance.prometheus.nz', url: 'https://finance.prometheus.nz', port: ':5000', desc: 'Real-time portfolio ledger, expense breakdown and asset valuation.' },
            { title: 'ADHD Companion', subdomain: 'adhd.prometheus.nz', url: 'https://adhd.prometheus.nz', port: ':5173', desc: 'Cognitive assistant, dopamine pacing, micro-tasks and focus sessions.' }
          ]
        },
        {
          id: 'technology',
          index: '08',
          title: 'Technology',
          dotClass: 'dot-tech',
          projects: [
            { title: 'Technology Workspace', subdomain: 'technology.prometheus.nz', url: 'https://technology.prometheus.nz', port: ':5000', desc: 'Engineering workbench, CAD models, schematics and hardware lab tools.' },
            { title: 'Motorsport Telemetry', subdomain: 'motorsport.prometheus.nz', url: 'https://motorsport.prometheus.nz', port: ':5000', desc: 'Track-day telemetry capture, lap time comparison and engine sensor feeds.' },
            { title: 'Automotive Telemetry', subdomain: 'automotive.prometheus.nz', url: 'https://automotive.prometheus.nz', port: ':5000', desc: 'OBD-II vehicle diagnostics, ECU status, live sensor bus and maintenance log.' },
            { title: 'Mooby Video Stream', subdomain: 'mooby.prometheus.nz', url: 'https://mooby.prometheus.nz', port: ':3000', desc: 'Private media pipeline, transcoding service and content playback hub.' }
          ]
        },
        {
          id: 'standby',
          index: '09',
          title: 'Placeholder',
          dotClass: 'dot-standby',
          projects: []
        }
      ];

      // DOM Elements
      const authOverlay = document.getElementById('authOverlay');
      const authPinContainer = document.getElementById('authPinContainer');
      const pinBoxes = authPinContainer.querySelectorAll('.otp-square');
      const authStatusMsg = document.getElementById('authStatusMsg');
      const stayCheckbox = document.getElementById('authStayCheckbox');
      const btnLock = document.getElementById('btnLockSession');
      const searchInput = document.getElementById('searchInput');
      const spatialViewport = document.getElementById('spatialViewport');
      const space3DScene = document.getElementById('space3DScene');
      const depthBarFill = document.getElementById('depthBarFill');
      const depthLabel = document.getElementById('depthLabel');
      const topHud = document.querySelector('.top-hud');
      const btnHeaderMacron = document.getElementById('btnHeaderMacron');

      // Authentication Session Handling
      function checkSession() {
        const session = localStorage.getItem(SESSION_KEY);
        const expiry = parseInt(localStorage.getItem(EXPIRY_KEY) || '0', 10);
        if (session === 'ACTIVE' && expiry > Date.now()) {
          unlockUI();
        } else {
          lockUI();
        }
      }

      function unlockUI() {
        authOverlay.classList.add('hidden');
        if (typeof showHeader === 'function') {
          showHeader();
        }
      }

      function lockUI() {
        localStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(EXPIRY_KEY);
        authOverlay.classList.remove('hidden');
        clearPin();
        authStatusMsg.className = 'auth-status-msg';
        authStatusMsg.textContent = 'ENTER AUTHORIZATION PIN';
        setTimeout(() => {
          if (pinBoxes[0]) pinBoxes[0].focus();
        }, 100);
      }

      function clearPin() {
        pinBoxes.forEach(b => b.value = '');
      }

      function getEnteredPin() {
        return Array.from(pinBoxes).map(b => b.value).join('');
      }

      function verifyPin() {
        const entered = getEnteredPin();
        if (VALID_PINS.includes(entered)) {
          authStatusMsg.className = 'auth-status-msg info';
          authStatusMsg.textContent = 'ACCESS GRANTED // INITIALIZING MESH';
          const duration = stayCheckbox.checked ? (48 * 3600 * 1000) : (4 * 3600 * 1000);
          localStorage.setItem(SESSION_KEY, 'ACTIVE');
          localStorage.setItem(EXPIRY_KEY, String(Date.now() + duration));
          setTimeout(unlockUI, 350);
        } else {
          authStatusMsg.className = 'auth-status-msg error';
          authStatusMsg.textContent = 'ACCESS DENIED // INVALID PIN';
          clearPin();
          if (pinBoxes[0]) pinBoxes[0].focus();
        }
      }

      // PIN Input Navigation
      pinBoxes.forEach((box, idx) => {
        box.addEventListener('input', (e) => {
          const val = box.value.replace(/[^0-9]/g, '');
          box.value = val ? val.slice(-1) : '';
          if (box.value && idx < pinBoxes.length - 1) {
            pinBoxes[idx + 1].focus();
          }
          const fullPin = getEnteredPin();
          if (fullPin.length === 6) {
            verifyPin();
          }
        });

        box.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !box.value && idx > 0) {
            pinBoxes[idx - 1].focus();
          } else if (e.key === 'Enter') {
            const fullPin = getEnteredPin();
            if (fullPin.length >= 4) {
              verifyPin();
            }
          }
        });

        box.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasteData = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
          if (!pasteData) return;
          for (let i = 0; i < pinBoxes.length; i++) {
            pinBoxes[i].value = pasteData[i] || '';
          }
          const nextIdx = Math.min(pasteData.length, pinBoxes.length - 1);
          pinBoxes[nextIdx].focus();
          if (pasteData.length >= 4) {
            verifyPin();
          }
        });
      });

      btnLock.addEventListener('click', lockUI);

      // ======================================================================
      // 3D SPATIAL ENGINE & INTERACTIVE CAMERA
      // ======================================================================
      const SPACING_X = 315;
      const SPACING_Y = 315;
      const DIVE_DEPTH = 480;

      // Calculate 3x3 coordinates for 9 sectors
      const sectorCoords = SECTOR_REGISTRY.map((s, idx) => {
        const col = (idx % 3) - 1;       // -1, 0, 1
        const row = Math.floor(idx / 3) - 1; // -1, 0, 1
        return {
          x: col * SPACING_X,
          y: row * SPACING_Y,
          z: 0
        };
      });

      // Camera State
      let camX = 0, camY = 0, camZ = 0;
      let targetCamX = 0, targetCamY = 0, targetCamZ = 0;
      let rotX = 0, rotY = 0;
      let targetRotX = 0, targetRotY = 0;
      let zoomProgress = 0; // 0.0 (matrix) to 1.0 (deep dive)
      let targetZoom = 0;

      let hoveredSectorIdx = null;
      let activeSectorIdx = null;

      // Build 3D Scene DOM Nodes
      function build3DScene() {
        space3DScene.innerHTML = '';

        SECTOR_REGISTRY.forEach((sector, idx) => {
          const coord = sectorCoords[idx];
          const isStandby = sector.id === 'standby';

          const node = document.createElement('div');
          node.className = 'sector-space-node';
          node.id = `node3D_${idx}`;
          node.style.transform = `translate3d(${coord.x}px, ${coord.y}px, 0px)`;

          // 1. FRONT SQUARE TILE (z = 0)
          const frontTile = document.createElement('div');
          frontTile.className = `sector-front-square sector-${sector.id} ${isStandby ? 'standby' : ''}`;
          frontTile.setAttribute('data-idx', idx);
          frontTile.innerHTML = `
            <span class="sector-dot ${sector.dotClass}"></span>
            <h2 class="sector-square-title">${sector.title}</h2>
          `;

          // Front tile interactions
          frontTile.addEventListener('mouseenter', () => {
            hoveredSectorIdx = idx;
            if (targetZoom < 0.3) {
              frontTile.classList.add('active-target');
            }
          });

          frontTile.addEventListener('mouseleave', () => {
            if (hoveredSectorIdx === idx) {
              hoveredSectorIdx = null;
              frontTile.classList.remove('active-target');
            }
          });

          frontTile.addEventListener('click', () => {
            diveIntoSector(idx);
          });

          // 2. DEEP PROJECT CLUSTER (3x3 grid at z = -480px)
          const deepCluster = document.createElement('div');
          deepCluster.className = 'sector-deep-cluster';
          deepCluster.id = `deepCluster_${idx}`;

          // Populate project cards inside deep cluster (Clicking card directly opens tool)
          let cardCount = 0;
          sector.projects.forEach((proj, pIdx) => {
            cardCount++;
            const slotNum = String(pIdx + 1).padStart(2, '0');
            const pCard = document.createElement('a');
            pCard.className = 'project-card';
            pCard.href = proj.url;
            pCard.target = '_blank';
            pCard.rel = 'noopener';
            pCard.innerHTML = `
              <div class="project-top">
                <div class="project-id-tag">
                  <span class="project-live-indicator"></span>
                  <span>NODE // ${slotNum}</span>
                </div>
                <span class="port-pill">${proj.port}</span>
              </div>
              <div class="project-body">
                <h3 class="project-title">${proj.title}</h3>
                <div class="project-subdomain">${proj.subdomain}</div>
                <p class="project-desc">${proj.desc}</p>
              </div>
            `;
            deepCluster.appendChild(pCard);
          });

          // Fill remaining slots up to 9 with tactical standby cards
          for (let s = cardCount; s < 9; s++) {
            const slotNum = String(s + 1).padStart(2, '0');
            const sCard = document.createElement('div');
            sCard.className = 'project-card slot-standby';
            sCard.innerHTML = `
              <div class="slot-standby-inner">
                <div class="slot-icon">&#10010;</div>
                <div class="slot-title">STANDBY // SLOT ${slotNum}</div>
                <div class="slot-desc">Unallocated Ingress Channel</div>
                <span class="port-pill" style="margin-top: 4px;">RESERVED</span>
              </div>
            `;
            deepCluster.appendChild(sCard);
          }

          node.appendChild(frontTile);
          node.appendChild(deepCluster);
          space3DScene.appendChild(node);
        });
      }

      function diveIntoSector(idx) {
        activeSectorIdx = idx;
        targetZoom = 1.0;
        targetCamX = sectorCoords[idx].x;
        targetCamY = sectorCoords[idx].y;
        targetCamZ = DIVE_DEPTH;
      }

      function resetZoom() {
        activeSectorIdx = null;
        targetZoom = 0;
        targetCamX = 0;
        targetCamY = 0;
        targetCamZ = 0;
        document.querySelectorAll('.sector-front-square').forEach(el => el.classList.remove('active-target'));
        showHeader();
      }

      // ======================================================================
      // HEADER AUTO-HIDE (5s), MACRON TOGGLE & TOUCH SWIPE-DOWN
      // ======================================================================
      let headerHideTimer = null;
      const AUTO_HIDE_MS = 5000;

      function hideHeader(force = false) {
        // If user is actively typing in search, don't auto-hide unless explicitly forced (e.g. clicking off header)
        if (!force && document.activeElement === searchInput && searchInput.value.trim().length > 0) return;

        // If search input is focused, blur it cleanly
        if (document.activeElement === searchInput) {
          searchInput.blur();
        }

        topHud.classList.add('header-hidden');
        document.body.classList.add('header-is-hidden');
        if (headerHideTimer) {
          clearTimeout(headerHideTimer);
          headerHideTimer = null;
        }
      }

      function showHeader() {
        topHud.classList.remove('header-hidden');
        document.body.classList.remove('header-is-hidden');
        resetHeaderTimer();
      }

      function resetHeaderTimer() {
        if (headerHideTimer) clearTimeout(headerHideTimer);
        // Only run auto-hide timer if session is unlocked
        if (authOverlay && authOverlay.classList.contains('hidden')) {
          headerHideTimer = setTimeout(() => hideHeader(false), AUTO_HIDE_MS);
        }
      }

      // Desktop Macron Button: Click to reveal header
      btnHeaderMacron.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
      });
      btnHeaderMacron.addEventListener('click', (e) => {
        e.stopPropagation();
        showHeader();
      });

      // Click off page header to dismiss it immediately
      document.addEventListener('pointerdown', (e) => {
        if (!topHud.classList.contains('header-hidden')) {
          if (!topHud.contains(e.target) && !btnHeaderMacron.contains(e.target)) {
            hideHeader(true);
          }
        }
      });

      // Keep header alive while interacting directly with it
      topHud.addEventListener('mouseenter', () => {
        if (headerHideTimer) clearTimeout(headerHideTimer);
      });
      topHud.addEventListener('mousemove', () => {
        if (headerHideTimer) clearTimeout(headerHideTimer);
      });
      topHud.addEventListener('mouseleave', () => {
        resetHeaderTimer();
      });

      searchInput.addEventListener('focus', () => {
        if (headerHideTimer) clearTimeout(headerHideTimer);
        showHeader();
      });
      searchInput.addEventListener('blur', () => {
        resetHeaderTimer();
      });

      // Touch Devices: Swipe down to reveal header
      let touchStartY = 0;
      let touchStartX = 0;
      let touchStartTime = 0;

      window.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length > 0) {
          touchStartY = e.touches[0].clientY;
          touchStartX = e.touches[0].clientX;
          touchStartTime = Date.now();
        }
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        if (e.changedTouches && e.changedTouches.length > 0) {
          const deltaY = e.changedTouches[0].clientY - touchStartY;
          const deltaX = e.changedTouches[0].clientX - touchStartX;
          const elapsed = Date.now() - touchStartTime;
          // Downward swipe: > 40px down, predominantly vertical, within 800ms
          if (deltaY > 40 && Math.abs(deltaY) > Math.abs(deltaX) * 1.2 && elapsed < 800) {
            showHeader();
          }
        }
      }, { passive: true });

      // Keyboard navigation (ESC at any point returns to landing matrix)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          resetZoom();
          if (document.activeElement) document.activeElement.blur();
          searchInput.value = '';
          showHeader();
        }
      });

      // ======================================================================
      // SCROLL WHEEL DYNAMIC ZOOM CONTROLLER (INTERCEPTS SCROLL TO ZOOM 3D)
      // ======================================================================
      spatialViewport.addEventListener('wheel', (e) => {
        e.preventDefault(); // Stop entire page from scrolling!

        const zoomSpeed = 0.16;

        if (e.deltaY < 0) {
          // SCROLL UP / ZOOM IN
          if (activeSectorIdx === null && hoveredSectorIdx !== null) {
            activeSectorIdx = hoveredSectorIdx;
          }
          if (activeSectorIdx === null) {
            // If hovering center or unassigned, default to center (Games)
            activeSectorIdx = 4;
          }

          targetZoom = Math.min(1.0, targetZoom + zoomSpeed);
          targetCamX = sectorCoords[activeSectorIdx].x;
          targetCamY = sectorCoords[activeSectorIdx].y;
          targetCamZ = targetZoom * DIVE_DEPTH;
        } else {
          // SCROLL DOWN / ZOOM OUT
          targetZoom = Math.max(0.0, targetZoom - zoomSpeed);
          targetCamZ = targetZoom * DIVE_DEPTH;

          if (targetZoom < 0.1) {
            activeSectorIdx = null;
            targetZoom = 0;
            targetCamX = 0;
            targetCamY = 0;
            targetCamZ = 0;
            document.querySelectorAll('.sector-front-square').forEach(el => el.classList.remove('active-target'));
          } else if (activeSectorIdx !== null) {
            targetCamX = sectorCoords[activeSectorIdx].x;
            targetCamY = sectorCoords[activeSectorIdx].y;
          }
        }
      }, { passive: false });

      // Mouse Parallax movement
      window.addEventListener('mousemove', (e) => {
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const normX = (e.clientX - cx) / cx;
        const normY = (e.clientY - cy) / cy;

        // When zoomed out, provide subtle 3D rotational tilt
        if (targetZoom < 0.4) {
          targetRotY = normX * 9;
          targetRotX = -normY * 7;
        } else {
          targetRotY = normX * 2.5;
          targetRotX = -normY * 2.5;
        }
      });

      // Search Box Filter & Auto-Dive
      searchInput.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase().trim();
        if (!q) {
          resetZoom();
          return;
        }

        // Find sector matching the search term
        const foundIdx = SECTOR_REGISTRY.findIndex(s => 
          s.title.toLowerCase().includes(q) ||
          s.projects.some(p => p.title.toLowerCase().includes(q) || p.subdomain.toLowerCase().includes(q))
        );

        if (foundIdx !== -1) {
          diveIntoSector(foundIdx);
        }
      });

      // 60FPS RAF RENDER LOOP
      function animationLoop() {
        // Smooth Lerp Camera
        camX += (targetCamX - camX) * 0.12;
        camY += (targetCamY - camY) * 0.12;
        camZ += (targetCamZ - camZ) * 0.12;

        rotX += (targetRotX - rotX) * 0.08;
        rotY += (targetRotY - rotY) * 0.08;

        zoomProgress += (targetZoom - zoomProgress) * 0.12;

        // Apply World Matrix
        space3DScene.style.transform = `translate3d(${-camX}px, ${-camY}px, ${camZ}px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;

        // Update HUD Gauge
        const pct = Math.round(zoomProgress * 100);
        depthBarFill.style.width = `${pct}%`;
        depthLabel.textContent = `${pct}%`;

        // Cross-fade front square tiles and deep clusters based on camera proximity
        SECTOR_REGISTRY.forEach((_, idx) => {
          const front = document.querySelector(`.sector-front-square[data-idx="${idx}"]`);
          const deep = document.getElementById(`deepCluster_${idx}`);

          if (!front || !deep) return;

          if (activeSectorIdx === idx) {
            // Focused sector: fade front out, fade deep in
            const frontOpacity = Math.max(0, 1 - zoomProgress * 2.2);
            front.style.opacity = frontOpacity;
            front.style.pointerEvents = frontOpacity > 0.5 ? 'auto' : 'none';

            const deepOpacity = Math.min(1, Math.max(0, (zoomProgress - 0.25) * 1.35));
            deep.style.opacity = deepOpacity;
            deep.style.pointerEvents = deepOpacity > 0.8 ? 'auto' : 'none';
          } else {
            // Other sectors: dim if another sector is being zoomed
            const dimFactor = Math.max(0.08, 1 - zoomProgress * 0.95);
            front.style.opacity = dimFactor;
            front.style.pointerEvents = zoomProgress < 0.2 ? 'auto' : 'none';
            deep.style.opacity = 0;
            deep.style.pointerEvents = 'none';
          }
        });

        requestAnimationFrame(animationLoop);
      }

      // Initialize
      build3DScene();
      requestAnimationFrame(animationLoop);
      checkSession();
    })();
  </script>
</body>
