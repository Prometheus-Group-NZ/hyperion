<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>HYPERION // Prometheus Fleet Launchpad</title>
  <meta name="description" content="Hyperion - Central Ingress Catalogue and Minimalist Tactical Fleet Launchpad for Prometheus Group NZ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #06090c;
      --bg-surface: #0c1017;
      --bg-card: rgba(14, 20, 28, 0.85);
      --bg-card-hover: rgba(22, 32, 45, 0.95);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(0, 255, 102, 0.35);
      
      --accent-green: #00ff66;
      --accent-cyan: #00e5ff;
      --accent-blue: #3b82f6;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --crt-bg: #000d00;
      --crt-phosphor: #00ff66;
      --crt-dim: rgba(0, 255, 102, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.05) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(0, 255, 102, 0.03) 0%, transparent 50%);
    }

    /* ==========================================================================
       IRIS-PC TERMINAL CRT AUTHENTICATION OVERLAY
       ========================================================================== */
    #authOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      z-index: 999999;
      background-color: var(--crt-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 32px);
      box-sizing: border-box;
      font-family: 'Share Tech Mono', 'JetBrains Mono', monospace;
      color: var(--crt-phosphor);
      overflow: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #authOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #authOverlay::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 2;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    #authOverlay::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at center, transparent 65%, rgba(0, 0, 0, 0.65) 100%);
      z-index: 3;
      pointer-events: none;
    }

    .auth-center-stage {
      position: relative;
      z-index: 4;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
      background: rgba(0, 20, 5, 0.4);
      border: 1px solid rgba(0, 255, 102, 0.2);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.08), inset 0 0 20px rgba(0, 255, 102, 0.03);
    }

    .auth-badge {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--crt-dim);
      margin-bottom: 8px;
    }

    .auth-title {
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--crt-phosphor);
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
      margin-bottom: 24px;
    }

    .auth-otp-pure {
      display: flex;
      gap: clamp(8px, 2.5vw, 14px);
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 10px 0;
    }

    .otp-square {
      flex: 0 1 clamp(42px, 12vw, 56px);
      width: clamp(42px, 12vw, 56px);
      height: clamp(52px, 15vw, 66px);
      background-color: rgba(0, 35, 10, 0.7);
      border: 1px solid rgba(0, 255, 102, 0.3);
      border-radius: 8px;
      color: var(--crt-phosphor);
      font-size: clamp(24px, 7vw, 32px);
      font-weight: 700;
      font-family: inherit;
      text-align: center;
      outline: none;
      box-sizing: border-box;
      caret-color: transparent;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    .otp-square:focus {
      border-color: var(--crt-phosphor);
      background-color: rgba(0, 50, 15, 0.85);
      box-shadow: 0 0 14px rgba(0, 255, 102, 0.4);
    }

    .auth-stay-toggle {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--crt-dim);
      cursor: pointer;
      user-select: none;
    }

    .auth-stay-toggle input {
      accent-color: var(--crt-phosphor);
      cursor: pointer;
    }

    .auth-status-msg {
      margin-top: 18px;
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--crt-dim);
      min-height: 18px;
    }

    .auth-status-msg.error {
      color: #ff3344;
      text-shadow: 0 0 8px rgba(255, 51, 68, 0.5);
      animation: shake 0.3s ease;
    }

    .auth-status-msg.info {
      color: var(--crt-phosphor);
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
    }

    /* ==========================================================================
       APP SHELL & TOP HUD
       ========================================================================== */
    .app-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(16px, 3vw, 32px);
      box-sizing: border-box;
      gap: 24px;
    }

    .top-hud {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-symbol {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border-active);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-green);
      font-size: 16px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.15);
      background: rgba(0, 255, 102, 0.05);
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(16px, 3vw, 20px);
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
    }

    .brand-text p {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      font-family: 'Share Tech Mono', monospace;
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 560px;
      justify-content: flex-end;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 180px;
    }

    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px 10px 34px;
      color: #fff;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 14px;
      pointer-events: none;
    }

    .btn-lock {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 9px 14px;
      border-radius: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-lock:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--accent-red);
      color: #fff;
    }

    /* Subview Navigation Breadcrumb Bar */
    .view-breadcrumb-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      font-family: 'Share Tech Mono', monospace;
    }

    .breadcrumb-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-nav-back {
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: var(--accent-cyan);
      padding: 8px 14px;
      border-radius: 6px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-nav-back:hover {
      background: rgba(0, 229, 255, 0.2);
      border-color: var(--accent-cyan);
      color: #fff;
      transform: translateX(-2px);
    }

    .breadcrumb-path {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .breadcrumb-path .active-sector {
      color: #fff;
      font-weight: 700;
    }

    .breadcrumb-meta {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    /* ==========================================================================
       3x3 GRID SYSTEM (APPLIED TO BOTH LANDING CATEGORIES & PROJECT SUBVIEW)
       ========================================================================== */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media (max-width: 1120px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 680px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    /* ==========================================================================
       LANDING PAGE: 9 CATEGORY ENTRY CARDS
       ========================================================================== */
    .category-entry-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      aspect-ratio: 1 / 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      padding: 24px;
      box-sizing: border-box;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .category-entry-card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.3);
      background: var(--bg-card-hover);
      box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.7);
    }

    .category-entry-card.sector-ai:hover { border-color: rgba(56, 189, 248, 0.6); box-shadow: 0 16px 36px -6px rgba(56, 189, 248, 0.25); }
    .category-entry-card.sector-security:hover { border-color: rgba(239, 68, 68, 0.6); box-shadow: 0 16px 36px -6px rgba(239, 68, 68, 0.25); }
    .category-entry-card.sector-intel:hover { border-color: rgba(245, 158, 11, 0.6); box-shadow: 0 16px 36px -6px rgba(245, 158, 11, 0.25); }
    .category-entry-card.sector-fleet:hover { border-color: rgba(16, 185, 129, 0.6); box-shadow: 0 16px 36px -6px rgba(16, 185, 129, 0.25); }
    .category-entry-card.sector-games:hover { border-color: rgba(168, 85, 247, 0.6); box-shadow: 0 16px 36px -6px rgba(168, 85, 247, 0.25); }
    .category-entry-card.sector-science:hover { border-color: rgba(6, 182, 212, 0.6); box-shadow: 0 16px 36px -6px rgba(6, 182, 212, 0.25); }
    .category-entry-card.sector-social:hover { border-color: rgba(236, 72, 153, 0.6); box-shadow: 0 16px 36px -6px rgba(236, 72, 153, 0.25); }
    .category-entry-card.sector-technology:hover { border-color: rgba(234, 179, 8, 0.6); box-shadow: 0 16px 36px -6px rgba(234, 179, 8, 0.25); }

    .category-entry-card.standby {
      border: 1px dashed rgba(255, 255, 255, 0.15);
      background: rgba(14, 20, 28, 0.4);
    }
    .category-entry-card.standby:hover {
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 16px 36px -6px rgba(100, 116, 139, 0.2);
    }

    .sector-square-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(20px, 2.4vw, 28px);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      text-align: center;
      margin: 0;
      user-select: none;
    }

    .sector-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-ai { background: #38bdf8; box-shadow: 0 0 12px #38bdf8; }
    .dot-sec { background: #ef4444; box-shadow: 0 0 12px #ef4444; }
    .dot-intel { background: #f59e0b; box-shadow: 0 0 12px #f59e0b; }
    .dot-fleet { background: #10b981; box-shadow: 0 0 12px #10b981; }
    .dot-games { background: #a855f7; box-shadow: 0 0 12px #a855f7; }
    .dot-sci { background: #06b6d4; box-shadow: 0 0 12px #06b6d4; }
    .dot-soc { background: #ec4899; box-shadow: 0 0 12px #ec4899; }
    .dot-tech { background: #eab308; box-shadow: 0 0 12px #eab308; }
    .dot-standby { background: #64748b; box-shadow: 0 0 10px #64748b; }

    /* ==========================================================================
       SUBVIEW: 3x3 DEDICATED PROJECT CARDS (1 CARD PER PROJECT)
       ========================================================================== */
    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 220px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .project-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.6);
      background: var(--bg-card-hover);
    }

    .project-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .project-id-tag {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .project-live-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
    }

    .port-pill {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      padding: 2px 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      color: var(--text-muted);
    }

    .project-body {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }

    .project-title {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .project-subdomain {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: var(--accent-cyan);
      word-break: break-all;
    }

    .project-desc {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .project-action-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .project-action-btn:hover {
      background: rgba(0, 229, 255, 0.15);
      border-color: var(--accent-cyan);
      color: #fff;
    }

    .project-action-btn .btn-arrow {
      color: var(--accent-cyan);
      transition: transform 0.15s ease;
    }

    .project-action-btn:hover .btn-arrow {
      transform: translate(2px, -2px);
    }

    /* Standby slots inside 3x3 subview */
    .project-card.slot-standby {
      border: 1px dashed rgba(255, 255, 255, 0.12);
      background: rgba(14, 20, 28, 0.35);
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .slot-standby-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .slot-icon {
      font-size: 22px;
      color: var(--text-dim);
      opacity: 0.5;
    }

    .slot-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-dim);
    }

    .slot-desc {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.2);
    }

    /* ==========================================================================
       FOOTER
       ========================================================================== */
    footer.bottom-bar {
      margin-top: auto;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      border-top: 1px solid var(--border-subtle);
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .footer-stat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
    }
  </style>
</head>
<body>

  <!-- ========================================================================
       IRIS-PC CRT TERMINAL AUTHENTICATION OVERLAY (6-DIGIT PIN)
       ======================================================================== -->
  <div id="authOverlay">
    <div class="auth-center-stage">
      <div class="auth-badge">PROMETHEUS SECURITY GATEWAY</div>
      <div class="auth-title">HYPERION INGRESS</div>
      
      <div class="auth-otp-pure" id="authPinContainer">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="0" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="1" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="2" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="3" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="4" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="5" autocomplete="off">
      </div>

      <label class="auth-stay-toggle" id="authStayWrapper">
        <input type="checkbox" id="authStayCheckbox" checked>
        <span>STAY LOGGED IN (48H)</span>
      </label>

      <div id="authStatusMsg" class="auth-status-msg">ENTER AUTHORIZATION PIN</div>
    </div>
  </div>

  <!-- ========================================================================
       MAIN HYPERION APPLICATION SHELL
       ======================================================================== -->
  <div class="app-shell" id="mainApp">
    <header class="top-hud">
      <div class="brand-section">
        <div class="brand-symbol">&#9650;</div>
        <div class="brand-text">
          <h1 id="hudBrandTitle">HYPERION</h1>
          <p id="hudBrandSubtitle">PROMETHEUS FLEET LAUNCHPAD // 9 SECTORS // 25 INGRESS NODES</p>
        </div>
      </div>

      <div class="hud-controls">
        <div class="search-box">
          <span class="search-icon">&#128269;</span>
          <input type="text" id="searchInput" placeholder="Filter nodes, subdomains, sectors..." autocomplete="off">
        </div>

        {
          id: 'standby',
          index: '09',

          dotClass: 'dot-standby',
          summary: 'Sector 09 provisioned for incoming mission expansion and ingress allocation.',
          projects: []
        }
      ];

      // DOM Elements
      const authOverlay = document.getElementById('authOverlay');
      const authPinContainer = document.getElementById('authPinContainer');
      const pinBoxes = authPinContainer.querySelectorAll('.otp-square');
      const authStatusMsg = document.getElementById('authStatusMsg');
      const stayCheckbox = document.getElementById('authStayCheckbox');
      const btnLock = document.getElementById('btnLockSession');
      const searchInput = document.getElementById('searchInput');
      const gridContainer = document.getElementById('gridContainer');
      const subviewBreadcrumb = document.getElementById('subviewBreadcrumb');
      const btnBackToMatrix = document.getElementById('btnBackToMatrix');
      const breadcrumbSectorName = document.getElementById('breadcrumbSectorName');
      const breadcrumbSectorMeta = document.getElementById('breadcrumbSectorMeta');
      const hudBrandSubtitle = document.getElementById('hudBrandSubtitle');

      // Authentication Session Handling
      function checkSession() {
        const session = localStorage.getItem(SESSION_KEY);
        const expiry = parseInt(localStorage.getItem(EXPIRY_KEY) || '0', 10);
        if (session === 'ACTIVE' && expiry > Date.now()) {
          unlockUI();
        } else {
          lockUI();
        }
      }

      function unlockUI() {
        authOverlay.classList.add('hidden');
        renderCurrentView();
        searchInput.focus();
      }

      function lockUI() {
        localStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(EXPIRY_KEY);
        authOverlay.classList.remove('hidden');
        clearPin();
        authStatusMsg.className = 'auth-status-msg';
        authStatusMsg.textContent = 'ENTER AUTHORIZATION PIN';
        setTimeout(() => {
          if (pinBoxes[0]) pinBoxes[0].focus();
        }, 100);
      }

      function clearPin() {
        pinBoxes.forEach(b => b.value = '');
      }

      function getEnteredPin() {
        return Array.from(pinBoxes).map(b => b.value).join('');
      }

      function verifyPin() {
        const entered = getEnteredPin();
        if (VALID_PINS.includes(entered)) {
          authStatusMsg.className = 'auth-status-msg info';
          authStatusMsg.textContent = 'ACCESS GRANTED // INITIALIZING MESH';
          const duration = stayCheckbox.checked ? (48 * 3600 * 1000) : (4 * 3600 * 1000);
          localStorage.setItem(SESSION_KEY, 'ACTIVE');
          localStorage.setItem(EXPIRY_KEY, String(Date.now() + duration));
          setTimeout(unlockUI, 350);
        } else {
          authStatusMsg.className = 'auth-status-msg error';
          authStatusMsg.textContent = 'ACCESS DENIED // INVALID PIN';
          clearPin();
          if (pinBoxes[0]) pinBoxes[0].focus();
        }
      }

      // PIN Input Navigation
      pinBoxes.forEach((box, idx) => {
        box.addEventListener('input', (e) => {
          const val = box.value.replace(/[^0-9]/g, '');
          box.value = val ? val.slice(-1) : '';
          if (box.value && idx < pinBoxes.length - 1) {
            pinBoxes[idx + 1].focus();
          }
          const fullPin = getEnteredPin();
          if (fullPin.length === 6) {
            verifyPin();
          }
        });

        box.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !box.value && idx > 0) {
            pinBoxes[idx - 1].focus();
          } else if (e.key === 'Enter') {
            const fullPin = getEnteredPin();
            if (fullPin.length >= 4) {
              verifyPin();
            }
          }
        });

        box.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasteData = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
          if (!pasteData) return;
          for (let i = 0; i < pinBoxes.length; i++) {
            pinBoxes[i].value = pasteData[i] || '';
          }
          const nextIdx = Math.min(pasteData.length, pinBoxes.length - 1);
          pinBoxes[nextIdx].focus();
          if (pasteData.length >= 4) {
            verifyPin();
          }
        });
      });

      // Lock Button
      btnLock.addEventListener('click', lockUI);

      // Back Button to return to Matrix
      btnBackToMatrix.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.hash = '';
      });

      // ======================================================================
      // VIEW ROUTER & RENDERERS
      // ======================================================================
      function getActiveSectorIdFromHash() {
        const hash = window.location.hash.replace(/^#/, '').trim();
        if (hash.startsWith('sector=')) {
          return hash.split('=')[1];
        }
        return null;
      }

      function renderCurrentView() {
        const activeSectorId = getActiveSectorIdFromHash();
        const searchQuery = searchInput.value.toLowerCase().trim();

        if (activeSectorId) {
          const sector = SECTOR_REGISTRY.find(s => s.id === activeSectorId);
          if (sector) {
            renderSectorProjectsView(sector, searchQuery);
            return;
          }
        }

        // Default: Render Landing Page 9 Category Cards
        renderLandingCategoryMatrix(searchQuery);
      }

      // 1. Render Landing Page: 9 Category Cards (NO child projects listed)
      function renderLandingCategoryMatrix(searchQuery) {
        subviewBreadcrumb.style.display = 'none';
        hudBrandSubtitle.textContent = 'PROMETHEUS FLEET LAUNCHPAD // 9 SECTORS // 25 INGRESS NODES';

        gridContainer.innerHTML = '';

        SECTOR_REGISTRY.forEach(sector => {
          const isStandby = sector.id === 'standby';
          const nodeCount = sector.projects.length;

          // Search matching across sector title, summary, or child projects
          const matchSector = !searchQuery || 
            sector.title.toLowerCase().includes(searchQuery) ||
            sector.summary.toLowerCase().includes(searchQuery) ||
            sector.projects.some(p => 
              p.title.toLowerCase().includes(searchQuery) || 
              p.subdomain.toLowerCase().includes(searchQuery) ||
              (p.search && p.search.toLowerCase().includes(searchQuery))
            );

          if (!matchSector) return;

          const card = document.createElement('div');
          card.className = `category-entry-card sector-${sector.id} ${isStandby ? 'standby' : ''}`;
          card.setAttribute('data-sector-id', sector.id);

          card.innerHTML = `
            <span class="sector-dot ${sector.dotClass}"></span>
            <h2 class="sector-square-title">${sector.title}</h2>
          `;

          card.addEventListener('click', () => {
            window.location.hash = `sector=${sector.id}`;
          });

          gridContainer.appendChild(card);
        });
      }

      // 2. Render Category View: 3x3 Grid of Project Cards (1 Card Per Project)
      function renderSectorProjectsView(sector, searchQuery) {
        subviewBreadcrumb.style.display = 'flex';
        breadcrumbSectorName.textContent = `${sector.title.toUpperCase()}`;
        breadcrumbSectorMeta.textContent = `SECTOR // ${sector.index} · 3x3 TACTICAL MATRIX · ${sector.projects.length} NODES ALLOCATED`;
        hudBrandSubtitle.textContent = `SECTOR ${sector.index} // ${sector.title.toUpperCase()} // INGRESS CONTROLLER`;

        gridContainer.innerHTML = '';

        let displayedCount = 0;

        // Render project cards
        sector.projects.forEach((proj, idx) => {
          const matchSearch = !searchQuery ||
            proj.title.toLowerCase().includes(searchQuery) ||
            proj.subdomain.toLowerCase().includes(searchQuery) ||
            (proj.search && proj.search.toLowerCase().includes(searchQuery)) ||
            (proj.desc && proj.desc.toLowerCase().includes(searchQuery));

          if (!matchSearch) return;

          displayedCount++;
          const slotNum = String(idx + 1).padStart(2, '0');

          const card = document.createElement('div');
          card.className = 'project-card';
          card.innerHTML = `
            <div>
              <div class="project-top">
                <div class="project-id-tag">
                  <span class="project-live-indicator"></span>
                  <span>NODE // ${slotNum}</span>
                </div>
                <span class="port-pill">${proj.port}</span>
              </div>
              <div class="project-body">
                <h2 class="project-title">${proj.title}</h2>
                <div class="project-subdomain">${proj.subdomain}</div>
                <p class="project-desc">${proj.desc}</p>
              </div>
            </div>
            <a href="${proj.url}" target="_blank" rel="noopener" class="project-action-btn">
              <span>LAUNCH INGRESS</span>
              <span class="btn-arrow">&#8599;</span>
            </a>
          `;
          gridContainer.appendChild(card);
        });

        // If not searching, fill remaining slots up to 9 to form a full 3x3 matrix aesthetic
        if (!searchQuery) {
          const totalSlots = 9;
          for (let i = displayedCount; i < totalSlots; i++) {
            const slotNum = String(i + 1).padStart(2, '0');
            const standbyCard = document.createElement('div');
            standbyCard.className = 'project-card slot-standby';
            standbyCard.innerHTML = `
              <div class="slot-standby-inner">
                <div class="slot-icon">&#10010;</div>
                <div class="slot-title">STANDBY // SLOT ${slotNum}</div>
                <div class="slot-desc">Unallocated Ingress Route</div>
                <span class="port-pill" style="margin-top: 6px;">RESERVED</span>
              </div>
            `;
            gridContainer.appendChild(standbyCard);
          }
        }
      }

      // Hash change listener for browser back/forward and deep-linking
      window.addEventListener('hashchange', () => {
        searchInput.value = '';
        renderCurrentView();
      });

      // Real-time Search input listener
      searchInput.addEventListener('input', () => {
        renderCurrentView();
      });

      // Initialize
      checkSession();
