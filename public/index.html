<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>HYPERION // Prometheus Fleet Launchpad</title>
  <meta name="description" content="Hyperion - Central Ingress Catalogue and Minimalist Tactical Fleet Launchpad for Prometheus Group NZ">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,4 28,26 4,26' fill='%2300e5ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ========================================================================
       PROMETHEUS LIVING PERSONA BACKGROUND STAGE
       - 1.17x framing (10% zoomed out from 1.30)
       - 50% darker chiaroscuro in dormant sleep
       - 3D perspective depth, organic eyelid morphing & micro-expressions
       - Distant ambient flickering fire glow from right flank
       ======================================================================== -->
  <div class="persona-stage" id="personaStage">
    <div class="persona-master-frame" id="personaMasterFrame">
      <img src="assets/prometheus_resting.jpg" alt="Prometheus Dormant" class="persona-layer-resting" id="imgResting">
      <img src="assets/prometheus_active.jpg" alt="Prometheus Active" class="persona-layer-active" id="imgActive" crossorigin="anonymous">
      <canvas id="eyeFlameCanvas"></canvas>
    </div>
    <div class="persona-dormant-shroud" id="personaDormantShroud"></div>
    <div class="persona-fire-ambient" id="personaFireAmbient"></div>
    <div class="persona-vignette-overlay"></div>
  </div>

  <!-- ========================================================================
       IRIS-PC CRT TERMINAL AUTHENTICATION OVERLAY (6-DIGIT PIN)
       ======================================================================== -->
  <div id="authOverlay">
    <div class="auth-center-stage">
      <div class="auth-badge">PROMETHEUS SECURITY GATEWAY</div>
      <div class="auth-title">HYPERION INGRESS</div>
      
      <div class="auth-otp-pure" id="authPinContainer">
        <input type="text" id="otp_0" name="otp_0" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="0" autocomplete="off">
        <input type="text" id="otp_1" name="otp_1" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="1" autocomplete="off">
        <input type="text" id="otp_2" name="otp_2" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="2" autocomplete="off">
        <input type="text" id="otp_3" name="otp_3" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="3" autocomplete="off">
        <input type="text" id="otp_4" name="otp_4" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="4" autocomplete="off">
        <input type="text" id="otp_5" name="otp_5" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-square" data-idx="5" autocomplete="off">
      </div>

      <label class="auth-stay-toggle" id="authStayWrapper">
        <input type="checkbox" id="authStayCheckbox" checked>
        <span>STAY LOGGED IN (48H)</span>
      </label>

      <div id="authStatusMsg" class="auth-status-msg">ENTER AUTHORIZATION PIN</div>
    </div>
  </div>

  <!-- ========================================================================
       MAIN HYPERION 3D LAUNCHPAD INTERFACE
       ======================================================================== -->
  <header class="top-hud">
    <div class="brand-section">
      <div class="brand-symbol">&#9650;</div>
      <div class="brand-text">
        <h1 id="hudBrandTitle">HYPERION</h1>
        <p id="hudBrandSubtitle">PROMETHEUS FLEET LAUNCHPAD // 3D SPATIAL DIVE MATRIX</p>
      </div>
    </div>

    <div class="hud-controls">
      <div class="search-box">
        <span class="search-icon">&#128269;</span>
        <input type="text" id="searchInput" placeholder="Search node, tool or sector (auto-dives)..." autocomplete="off">
      </div>
      <button class="btn-lock" id="btnLockSession" title="Lock Session">&#128274; LOCK</button>
    </div>
  </header>

  <!-- Floating Macron Button for Non-Touch Devices -->
  <button class="btn-header-macron" id="btnHeaderMacron" title="Open Header [—]">&#8212;</button>

  <!-- Dynamic 3D Spatial Viewport -->
  <main class="spatial-viewport-3d" id="spatialViewport">
    <div class="space-3d-scene" id="space3DScene">
      <!-- 9 Sectors positioned dynamically in 3D -->
    </div>

    <!-- Floating Tactical 3D HUD -->
    <div class="hud-3d-panel">
      <div class="hud-depth-gauge">
        <span style="color: var(--text-dim); font-size: 11px;">DEPTH</span>
        <div class="depth-bar-track">
          <div class="depth-bar-fill" id="depthBarFill"></div>
        </div>
        <span id="depthLabel" style="font-size: 11px; color: var(--accent-cyan); min-width: 32px;">0%</span>
      </div>
    </div>
  </main>

  <footer class="bottom-bar" id="bottomBar">
    <div class="footer-left">
      <span class="footer-stat"><span class="status-live-dot"></span> PROMETHEUS MESH ONLINE</span>
      <span>ZONE: prometheus.nz</span>
    </div>
    <div class="footer-right">
      <span id="personaTelemetry" style="color: var(--text-dim); display: inline-flex; align-items: center;">
        <span class="persona-status-dot" id="personaDot"></span>
        <span id="personaStatusText">PROMETHEUS CORE: DORMANT</span>
      </span>
      <span style="color: var(--text-dim); margin-left: 12px;">HYPERION // 3D SPATIAL MATRIX</span>
    </div>
  </footer>

  <!-- Modular Scripts -->
  <script src="js/persona.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
